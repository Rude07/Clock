<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clock">
<meta name="theme-color" content="#D9DCD6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%23D9DCD6%27 stroke=%27%231F2A2E%27 stroke-width=%272%27/%3E%3Cpath d=%27M16 8v8l5 3%27 stroke=%27%231F2A2E%27 stroke-width=%272%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@200;300&family=IBM+Plex+Sans:wght@400&family=Noto+Sans+Malayalam:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #D9DCD6;
    --ink: #1F2A2E;
    --dim: #8A9490;
    --faint: #B9BEB8;
    --accent: #3C6E71;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151A1C; --ink: #C9D1CF; --dim: #5B6663; --faint: #2A3235; --accent: #7FB0A8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151A1C; --ink: #C9D1CF; --dim: #5B6663; --faint: #2A3235; --accent: #7FB0A8;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", "Noto Sans Malayalam", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overflow: hidden;
  }
  #face {
    height: 100%; width: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.1rem;
    touch-action: none; cursor: default; outline: none;
  }
  #face:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  #time {
    font-family: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    font-weight: 200; font-size: clamp(5.5rem, 30vw, 14rem); line-height: 0.9;
    letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
    transition: opacity .15s ease, transform .15s ease;
  }
  #colon { display: inline-block; transition: color .3s ease; }
  #colon.off { opacity: .25; }
  body.unread #colon { color: var(--accent); }
  body.pressing #time { opacity: .82; transform: scale(.992); }
  body.long #time { opacity: .68; }
  #ap { display: inline-block; font-size: .16em; letter-spacing: .04em; vertical-align: .35em; color: var(--dim); font-family: "IBM Plex Sans", system-ui, sans-serif;
    padding: 1.2em 1.1em 1.2em .35em; margin: -1.2em -1.1em -1.2em 0; } /* bigger invisible tap area for quick lock */
  #setup { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 3rem); transform: translateX(-50%); display: flex; gap: .5rem; width: min(90vw, 26rem); }
  #setup[hidden] { display: none; }
  #setup input { flex: 1; min-width: 0; font: inherit; font-size: .85rem; padding: .6rem .7rem; border-radius: 8px; border: 1px solid var(--faint); background: transparent; color: var(--ink); -webkit-user-select: text; user-select: text; }
  #setup button { font: inherit; font-size: .85rem; padding: .6rem .9rem; border-radius: 8px; border: 0; background: var(--accent); color: var(--bg); }
  #date {
    font-size: 1rem; color: var(--dim); min-height: 1.5em; padding: .9rem 2rem; min-width: 12rem;
    cursor: pointer; touch-action: none;
    text-align: center; max-width: 22rem; letter-spacing: .01em;
  }
  #date.peek { color: var(--ink); }
  #date.preview { color: var(--accent); }
  #marks { display: flex; gap: 6px; align-items: center; height: 8px; transition: opacity .6s ease; }
  #marks span { display: block; height: 4px; border-radius: 2px; background: var(--faint); }
  #marks span.d { width: 4px; }
  #marks span.l { width: 14px; }
  #marks.in span { background: var(--dim); }
  #marks.out span { background: var(--accent); }
  #marks.fade { opacity: 0; }
  #marks.shake { animation: shake .35s ease; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  #note { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
    text-align: center; font-size: .75rem; color: var(--dim); padding: 0 1rem; }
  @media (prefers-reduced-motion: reduce) {
    #time, #marks, #colon { transition: none; }
    #marks.shake { animation: none; }
  }
</style>
</head>
<body>
<div id="face" role="button" tabindex="0" aria-label="Clock">
  <div id="time"><span id="hh">--</span><span id="colon">:</span><span id="mm">--</span><span id="ap"></span></div>
  <div id="date"></div>
  <div id="marks" aria-hidden="true"></div>
</div>
<div id="note"></div>
<form id="setup" hidden><input id="setupLink" type="text" inputmode="url" autocomplete="off" placeholder="Paste your link" aria-label="Setup link"><button type="submit">Save</button></form>

<script>
/* ===================== Codebook ===================== */
/* "." = short tap, "-" = long press */
const CODEBOOK = {
  ".":    "Yes",
  "-":    "No",
  ".-":   "OK",
  "--":   "Pinne parayam",
  "..":   "ഉറങ്ങുവാ, ഗുഡ് നൈറ്റ്",
  "-.":   "ഇവിടെ പ്രശ്നങ്ങളുണ്ട്",
  "...":  "കഴിച്ചോ?",
  "---":  "സംസാരിക്കണം, വിളിക്കാമോ?",
  ".--":  "എവിടെയാ?",
  "-..":  "എല്ലാം ഓക്കെ അല്ലേ?",
  "..-":  "വീടിന് പുറത്താണ്",
  "-.-":  "ഇന്ന് കാണാമോ?",
  ".-.":  "Home",
  "--.":  "അത്യാവശ്യം, ഉടനെ വിളിക്ക്",
  "....": "Hi",
  "...-": "ഓഫീസിലാണോ?",
  ".-.-": "ലവ് യൂ",
  "----": "ഞാനുണ്ട് കൂടെ, സാരമില്ല",
  "..--": "TC, Bye"
};

/* ===================== Settings ===================== */
const LONG_MS = 280;          // hold longer than this = dash
const SEND_AFTER = 1800;      // pause this long = send
const MAX_LEN = 4;
const UNLOCK_MS = 30000;      // sending stays unlocked this long after the last touch
const TRIPLE_MS = 800;        // three date taps within this = reveal + unlock
const PEEK_MS = 2600;
const NET_TIMEOUT = 8000;     // give up on a network call after this
const RETRY_MS = 10000;       // retry unsent messages this often
const GIVE_UP_MS = 15 * 60000;// drop a message that couldn't go out in 15 minutes
const REFRESH_MS = 60000;     // backup check for new messages while open
const HERE_EVERY_MS = 240000; // "I'm here" refresh while open
const HERE_FRESH_S = 300;     // how long a "here" counts
const HISTORY_MAX = 3;        // received messages kept on the phone
const HISTORY_TTL = 24 * 3600000; // ...and forgotten after 24 hours
const SWIPE_PX = 40;          // swipe left on the date this far = older message
const DOUBLE_MS = 450;        // two taps on am/pm within this = lock now

const SERVER = "https://ntfy.sh";
const NOTE_TITLE = "Backup";
const NOTE_TEXT = "Sync complete";

const $ = id => document.getElementById(id);
const face = $("face"), dateEl = $("date"), marksEl = $("marks"), noteEl = $("note"), apEl = $("ap");

/* ===================== Small helpers ===================== */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
function tfetch(url, opts = {}, ms = NET_TIMEOUT) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, Object.assign({}, opts, { signal: ctrl.signal }))
    .finally(() => clearTimeout(timer));
}
let noteTimer = null;
function note(text, ms) {
  noteEl.textContent = text || "";
  clearTimeout(noteTimer);
  if (text && ms) noteTimer = setTimeout(() => { noteEl.textContent = ""; }, ms);
}

/* ===================== Lock ===================== */
let unlockedUntil = 0;
const isUnlocked = () => Date.now() < unlockedUntil;
const touchUnlock = () => { if (isUnlocked()) unlockedUntil = Date.now() + UNLOCK_MS; };

/* ===================== Clock + date line ===================== */
let peekText = null, previewText = null, peekTimer = null;
function dateText() {
  return new Date().toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}
function renderDate() {
  dateEl.classList.toggle("preview", previewText !== null);
  dateEl.classList.toggle("peek", previewText === null && peekText !== null);
  dateEl.textContent = previewText !== null ? previewText : peekText !== null ? peekText : dateText();
}
function tick() {
  const n = new Date();
  $("hh").textContent = String(n.getHours() % 12 || 12);
  $("ap").textContent = n.getHours() < 12 ? "am" : "pm";
  $("mm").textContent = String(n.getMinutes()).padStart(2, "0");
  $("colon").classList.toggle("off", !isUnlocked() && n.getSeconds() % 2 === 1);
  renderDate();
}
tick(); setInterval(tick, 1000);

/* ===================== Marks ===================== */
function drawMarks(code, kind) {
  marksEl.className = kind || "";
  marksEl.innerHTML = "";
  for (const c of code) {
    const s = document.createElement("span");
    s.className = c === "." ? "d" : "l";
    marksEl.appendChild(s);
  }
}
const restoreMarks = () => latest ? drawMarks(latest.code, "in") : drawMarks("");

/* ===================== Incoming + history ===================== */
// Last few received messages, newest first: [{ key, code, t, seen }]
function loadHistory() {
  try {
    const h = JSON.parse(store.get("history") || "[]");
    return Array.isArray(h) ? h.filter(x => x && CODEBOOK[x.code] && typeof x.t === "number") : [];
  } catch { return []; }
}
let history = loadHistory();
let latest = null;
const saveHistory = () => store.set("history", JSON.stringify(history));
function pruneHistory() {
  const before = history.length;
  history = history.filter(x => Date.now() - x.t < HISTORY_TTL);
  if (history.length !== before) saveHistory();
  latest = history[0] || null;
}
const refreshUnread = () => document.body.classList.toggle("unread", history.some(x => !x.seen));
pruneHistory(); refreshUnread();

function addIncoming(item, fresh) {
  if (history.some(x => x.key === item.key)) return;
  item.seen = item.t <= Number(store.get("seen") || 0);
  history.push(item);
  history.sort((a, b) => b.t - a.t);
  history = history.slice(0, HISTORY_MAX);
  if (!history.includes(item)) return;          // older than everything kept
  saveHistory();
  latest = history[0];
  if (!buffer) drawMarks(latest.code, "in");
  refreshUnread();
  if (fresh && !item.seen && navigator.vibrate) {
    const pattern = [];
    for (const c of item.code) pattern.push(c === "." ? 90 : 280, 140);
    try { navigator.vibrate(pattern); } catch {}
  }
}
function ago(t) {
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  return h < 24 ? h + " h ago" : Math.round(h / 24) + " d ago";
}

let peekIndex = 0;
function showPeek(text) {
  peekText = text;
  renderDate();
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => { peekText = null; renderDate(); }, PEEK_MS);
}
function peekAt(i) {
  const it = history[i];
  const pos = history.length > 1 ? ", " + (i + 1) + "/" + history.length : "";
  showPeek(CODEBOOK[it.code] + " (" + ago(it.t) + pos + ")");
}
function peek() {                       // triple-tap: newest message
  pruneHistory();
  peekIndex = 0;
  if (!history.length) { showPeek("Nothing yet"); return; }
  for (const x of history) x.seen = true;
  store.set("seen", String(history[0].t));
  saveHistory(); refreshUnread();
  peekAt(0);
}
function peekOlder() {                  // swipe left while showing: one older
  if (peekText === null || !history.length) return;
  if (peekIndex + 1 < history.length) { peekIndex++; peekAt(peekIndex); }
  else showPeek("No older messages");
}

/* ===================== Composing ===================== */
let buffer = "", pressStart = 0, longTimer = null, sendTimer = null;
let enqueue = () => {}; // set up once connected

function startPress() {
  clearTimeout(sendTimer);
  pressStart = performance.now();
  document.body.classList.add("pressing");
  longTimer = setTimeout(() => document.body.classList.add("long"), LONG_MS);
}
function endPress() {
  if (!pressStart) return;
  const held = performance.now() - pressStart;
  pressStart = 0;
  clearTimeout(longTimer);
  document.body.classList.remove("pressing", "long");
  buffer += held > LONG_MS ? "-" : ".";
  if (buffer.length > MAX_LEN) { reject(); return; }
  drawMarks(buffer, "out");
  // Preview what will be sent; a single tap on it cancels
  previewText = CODEBOOK[buffer] ? "→ " + CODEBOOK[buffer] : null;
  renderDate();
  sendTimer = setTimeout(finish, SEND_AFTER);
}
function clearCompose() {
  clearTimeout(sendTimer); clearTimeout(longTimer);
  buffer = ""; pressStart = 0; previewText = null;
  document.body.classList.remove("pressing", "long");
  renderDate();
}
function reject() {
  clearCompose();
  marksEl.classList.add("shake");
  setTimeout(restoreMarks, 400);
}
function finish() {
  const code = buffer;
  clearCompose();
  if (!CODEBOOK[code]) { reject(); return; }
  enqueue(code);
  setTimeout(() => {
    marksEl.classList.add("fade");
    setTimeout(restoreMarks, 600);
  }, 700);
}

/* ===================== Touch handling ===================== */
face.addEventListener("pointerdown", e => {
  if (e.target === dateEl) return;
  if (e.target === apEl) { e.preventDefault(); return; }   // am/pm is the quick-lock spot
  e.preventDefault();
  if (!isUnlocked()) return;           // locked: taps do nothing
  touchUnlock();
  try { face.setPointerCapture(e.pointerId); } catch {}
  startPress();
});
face.addEventListener("pointerup", e => { if (e.target !== dateEl) endPress(); });
face.addEventListener("pointercancel", () => {
  pressStart = 0; clearTimeout(longTimer);
  document.body.classList.remove("pressing", "long");
});
face.addEventListener("contextmenu", e => e.preventDefault());

/* Quick lock: double-tap the am/pm to hide everything and lock at once */
function lockNow() {
  unlockedUntil = 0;
  clearCompose();
  clearTimeout(peekTimer);
  peekText = null;
  dateTaps = [];
  restoreMarks();
  tick();
}
let apLastTap = 0;
apEl.addEventListener("pointerup", e => {
  e.stopPropagation(); e.preventDefault();
  const now = Date.now();
  if (now - apLastTap < DOUBLE_MS) { apLastTap = 0; lockNow(); }
  else apLastTap = now;
});

let dateTaps = [], swipeStartX = null;
dateEl.addEventListener("pointerdown", e => {
  e.stopPropagation(); e.preventDefault();
  swipeStartX = e.clientX;
  try { dateEl.setPointerCapture(e.pointerId); } catch {}
});
dateEl.addEventListener("pointercancel", () => { swipeStartX = null; });
dateEl.addEventListener("pointerup", e => {
  e.stopPropagation(); e.preventDefault();
  const dx = swipeStartX === null ? 0 : e.clientX - swipeStartX;
  swipeStartX = null;
  if (dx <= -SWIPE_PX) {                // swipe left
    dateTaps = [];
    if (!buffer) peekOlder();
    return;
  }
  if (Math.abs(dx) > 25) return;        // some other drag: ignore
  if (buffer) {                         // composing: one tap cancels
    reject(); dateTaps = [];
    note("Cancelled", 1500);
    return;
  }
  const now = Date.now();
  dateTaps = dateTaps.filter(t => now - t < TRIPLE_MS);
  dateTaps.push(now);
  if (dateTaps.length >= 3) {
    dateTaps = [];
    unlockedUntil = now + UNLOCK_MS;
    peek(); tick();
  }
});
face.addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter") && !e.repeat && isUnlocked()) { e.preventDefault(); touchUnlock(); startPress(); }
});
face.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") endPress(); });

/* ===================== Message format ===================== */
// Codes travel as invisible characters plus the time they were tapped.
const ZW = { ".": "\u200B", "-": "\u200C" };
const encode = (code, at) => NOTE_TEXT + [...code].map(c => ZW[c]).join("") + "|" + at;
function decode(text) {
  text = String(text || "");
  let code = "";
  for (const ch of text) {
    if (ch === "\u200B") code += ".";
    else if (ch === "\u200C") code += "-";
  }
  const m = text.match(/\|(\d{12,14})$/);
  return { code, at: m ? Number(m[1]) : null };
}

/* ===================== Setup link ===================== */
function readConfig() {
  const p = new URLSearchParams(location.hash.slice(1));
  const ok = s => /^[A-Za-z0-9_-]{8,60}$/.test(s || "");
  let me = p.get("me"), to = p.get("to");
  if (ok(me) && ok(to) && me !== to) { store.set("me", me); store.set("to", to); return { me, to }; }
  me = store.get("me"); to = store.get("to");
  return ok(me) && ok(to) && me !== to ? { me, to } : null;
}

const cfg = readConfig();
if (!cfg) {
  const form = $("setup");
  form.hidden = false;
  form.addEventListener("submit", e => {
    e.preventDefault();
    const raw = $("setupLink").value.trim();
    const hash = raw.includes("#") ? raw.slice(raw.indexOf("#") + 1) : raw;
    location.hash = hash;
    if (readConfig()) location.reload();
    else note("That link didn't work. Check it and try again.");
  });
} else {
  /* Three channels per person, all from the same setup link:
       cfg.me        -> the ntfy app's channel (lock-screen alert only)
       cfg.me + "_d" -> the codes, read only by the clock
       cfg.me + "_p" -> "here" / "away", so the other side knows if the clock is open */
  const DATA = t => t + "_d";
  const PRES = t => t + "_p";

  const post = (topic, extra) => tfetch(SERVER, {
    method: "POST",
    body: JSON.stringify(Object.assign({ topic }, extra))
  }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); });

  async function partnerIsHere() {
    try {
      const r = await tfetch(SERVER + "/" + PRES(cfg.to) + "/json?poll=1&since=10m");
      if (!r.ok) return false;
      let last = null;
      for (const line of (await r.text()).split("\n")) {
        if (!line.trim()) continue;
        try { const m = JSON.parse(line); if (m.event === "message") last = m; } catch {}
      }
      return !!last && last.message === "here" && (Date.now() / 1000 - last.time) < HERE_FRESH_S;
    } catch { return false; } // unsure -> send the alert anyway
  }

  /* ---------- Outbox: nothing is lost if the network drops ---------- */
  const loadOutbox = () => { try { return JSON.parse(store.get("outbox") || "[]"); } catch { return []; } };
  const saveOutbox = box => store.set("outbox", JSON.stringify(box));
  let flushing = false, retryTimer = null;

  enqueue = code => {
    const box = loadOutbox();
    box.push({ code, at: Date.now(), dataSent: false });
    saveOutbox(box);
    flush();
  };

  async function flush() {
    if (flushing) return;
    flushing = true;
    clearTimeout(retryTimer);
    let box = loadOutbox(), dropped = false;
    while (box.length) {
      const item = box[0];
      if (Date.now() - item.at > GIVE_UP_MS) { box.shift(); saveOutbox(box); dropped = true; continue; }
      try {
        if (!item.dataSent) {
          await post(DATA(cfg.to), { message: encode(item.code, item.at) });
          item.dataSent = true; saveOutbox(box);
        }
        if (!(await partnerIsHere())) {
          await post(cfg.to, { title: NOTE_TITLE, message: NOTE_TEXT });
        }
        box.shift(); saveOutbox(box);
      } catch {
        note("Waiting for connection…");
        retryTimer = setTimeout(flush, RETRY_MS);
        flushing = false;
        return;
      }
    }
    flushing = false;
    note(dropped ? "A message couldn't be sent. Please send it again." : "", dropped ? 6000 : 0);
  }
  window.addEventListener("online", flush);

  /* ---------- Presence ---------- */
  let presState = null, hereTimer = null;
  function presence(state) {
    const body = JSON.stringify({ topic: PRES(cfg.me), message: state });
    if (state === "away" && navigator.sendBeacon) {
      try { if (navigator.sendBeacon(SERVER, body)) return; } catch {}
    }
    fetch(SERVER, { method: "POST", body, keepalive: true }).catch(() => {});
  }
  function goHere() {
    if (presState !== "here") { presState = "here"; presence("here"); }
    clearInterval(hereTimer);
    hereTimer = setInterval(() => presence("here"), HERE_EVERY_MS);
  }
  function goAway() {
    clearInterval(hereTimer);
    if (presState !== "away") { presState = "away"; presence("away"); }
  }

  /* ---------- Receiving ---------- */
  const seenKeys = new Set();
  let firstLoad = true;
  function handle(msg, live) {
    if (!msg || msg.event !== "message") return;
    const { code, at } = decode(msg.message);
    if (!CODEBOOK[code]) return;
    const server = (msg.time || 0) * 1000;
    const key = at ? code + "@" + at : msg.id;
    if (seenKeys.has(key)) return;      // ignore duplicates from retries
    seenKeys.add(key);
    // Use the time it was tapped, kept within sensible bounds of the server's time
    const t = at ? Math.min(server, Math.max(at, server - GIVE_UP_MS - 60000)) : server;
    if (Date.now() - t > HISTORY_TTL) return;
    addIncoming({ key, code, t }, live && !firstLoad);
  }

  let polling = false;
  async function poll() {
    if (polling) return;
    polling = true;
    try {
      const r = await tfetch(SERVER + "/" + DATA(cfg.me) + "/json?poll=1&since=all");
      if (!r.ok) throw new Error("HTTP " + r.status);
      for (const line of (await r.text()).split("\n")) {
        if (!line.trim()) continue;
        try { handle(JSON.parse(line), false); } catch {}
      }
      if (noteEl.textContent === "Offline.") note("");
    } catch {
      if (!loadOutbox().length) note("Offline.");
    }
    firstLoad = false;
    polling = false;
  }

  let es = null;
  function listen() {
    if (es && es.readyState !== 2) return;   // already connected
    try {
      es = new EventSource(SERVER + "/" + DATA(cfg.me) + "/sse");
      es.onmessage = e => { try { handle(JSON.parse(e.data), true); } catch {} };
    } catch {}
  }
  function stopListening() { if (es) { es.close(); es = null; } }

  /* ---------- Open / closed ---------- */
  let refreshTimer = null;
  function onVisible() {
    goHere(); poll().then(listen); flush();
    clearInterval(refreshTimer);
    refreshTimer = setInterval(() => { poll(); listen(); }, REFRESH_MS);
  }
  function onHidden() {
    clearInterval(refreshTimer);
    goAway(); stopListening();
    clearCompose(); restoreMarks();
    unlockedUntil = 0;                  // lock again when the clock is closed
  }
  window.__clockVisible = v => (v ? onVisible() : onHidden()); // used by the Android app

  if (document.visibilityState === "visible") onVisible(); else poll();
  document.addEventListener("visibilitychange", () => {
    document.visibilityState === "visible" ? onVisible() : onHidden();
  });
  window.addEventListener("pagehide", onHidden);
}
</script>
</body>
</html>
